name: Parkhu Daily Data Collection

on:
  schedule:
    - cron: "30 0 * * *"   # Every day at 6:00 AM IST (00:30 UTC)
  workflow_dispatch: {}    # Allow manual runs from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Optional Groq desk note in research_pack (Pages + Claude feed). Rotate if exposed.
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

permissions:
  contents: write             # needed to commit the day's output back
  actions: write              # dispatch Deploy Parkhu Pages after bot push

jobs:
  collect:
    runs-on: ubuntu-latest
    # OHLC cold backfill + Yahoo rate-limit retries (3–4 min waits) need headroom.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Run Parkhu Data Collector
        run: python run.py

      # Data-bot commit: path-scoped only (output / logs / trades / database/ohlc).
      # Never stage code, secrets, or .env. Prefer branch protection on main for
      # human PRs; this job is the intentional exception for generated artifacts.
      # GITHUB_TOKEN pushes do NOT trigger path-filtered Pages workflows, so we
      # explicitly workflow_dispatch Deploy Parkhu Pages after a successful push.
      - name: Commit collected data
        id: commit_data
        run: |
          git config user.name  "parkhu-bot"
          git config user.email "parkhu-bot@users.noreply.github.com"
          # trades/ carries the suggestion ledger across runs — without it the
          # open positions and the measured hit rate reset every day.
          # database/ohlc/ is the GitHub-backed raw OHLC store (incremental daily).
          git add -- output/ logs/ trades/ database/ohlc/ || true
          if git diff --staged --quiet; then
            echo "No new data to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: daily collection $(date -u +'%Y-%m-%d')"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Parkhu Pages
        if: steps.commit_data.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Deploy Parkhu Pages" --ref "${{ github.ref_name }}"
          echo "Dispatched Deploy Parkhu Pages on ${{ github.ref_name }}"

      - name: Publish output links
        if: always()
        run: |
          DATE="${PARKHU_RUN_DATE:-$(TZ=Asia/Kolkata date +%Y-%m-%d)}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BASE_RAW="https://raw.githubusercontent.com/${REPO}/${BRANCH}"
          BASE_BLOB="https://github.com/${REPO}/blob/${BRANCH}"
          OUT_DIR="output/${DATE}"
          PAGES="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          {
            echo "## Parkhu Data — ${DATE}"
            echo ""
            echo "**Claude handoff (no zip):** [research_pack.md](${BASE_RAW}/output/latest/research_pack.md) · [index.json](${BASE_RAW}/output/index.json)"
            echo ""
            echo "**Dashboard:** [${PAGES}](${PAGES}) — UI deploy: workflow \`Deploy Parkhu Pages\`"
            echo ""
            echo "**Latest folder:** [output/latest/](${BASE_BLOB}/output/latest/)"
            echo ""
            echo "| File | Raw (direct) | Browse |"
            echo "|------|--------------|--------|"
            if [ -d "$OUT_DIR" ]; then
              find "$OUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort | while read -r name; do
                echo "| \`${name}\` | [raw](${BASE_RAW}/${OUT_DIR}/${name}) | [view](${BASE_BLOB}/${OUT_DIR}/${name}) |"
              done
            else
              echo "| _(no files — run may have failed)_ | | |"
            fi
            echo ""
            echo "### Zip packages (archive only)"
            echo ""
            echo "| Archive | Raw (direct) | Browse |"
            echo "|---------|--------------|--------|"
            echo "| \`${DATE}.zip\` | [raw](${BASE_RAW}/output/${DATE}.zip) | [view](${BASE_BLOB}/output/${DATE}.zip) |"
            echo "| \`latest.zip\` | [raw](${BASE_RAW}/output/latest.zip) | [view](${BASE_BLOB}/output/latest.zip) |"
          } >> "$GITHUB_STEP_SUMMARY"
