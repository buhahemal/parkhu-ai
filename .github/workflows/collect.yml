name: Parkhu Daily Data Collection

on:
  schedule:
    - cron: "30 0 * * *"   # Every day at 6:00 AM IST (00:30 UTC)
  workflow_dispatch: {}    # Allow manual runs from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write             # needed to commit the day's output back
  models: read                # free-tier GitHub Models for news_classify (no paid billing)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      # Free-tier Models only. Never enable paid GitHub Models billing.
      # Local default is off unless PARKHU_GH_MODELS=1 + token.
      - name: Run Parkhu Data Collector
        env:
          PARKHU_GH_MODELS: "1"
          PARKHU_GH_MODEL: openai/gpt-4o-mini
        run: python run.py

      # Data-bot commit: path-scoped only (output / logs / trades). Never stage
      # code, secrets, or .env. Prefer branch protection on main for human PRs;
      # this job is the intentional exception for generated artifacts.
      - name: Commit collected data
        run: |
          git config user.name  "parkhu-bot"
          git config user.email "parkhu-bot@users.noreply.github.com"
          # trades/ carries the suggestion ledger across runs — without it the
          # open positions and the measured hit rate reset every day.
          git add -- output/ logs/ trades/ || true
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: daily collection $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Publish output links
        if: always()
        run: |
          DATE="${PARKHU_RUN_DATE:-$(TZ=Asia/Kolkata date +%Y-%m-%d)}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BASE_RAW="https://raw.githubusercontent.com/${REPO}/${BRANCH}"
          BASE_BLOB="https://github.com/${REPO}/blob/${BRANCH}"
          OUT_DIR="output/${DATE}"

          {
            echo "## Parkhu Data — ${DATE}"
            echo ""
            echo "Public links to today's collected files (branch \`${BRANCH}\`):"
            echo ""
            echo "**Folder:** [${OUT_DIR}/](${BASE_BLOB}/${OUT_DIR}/)"
            echo ""
            echo "| File | Raw (direct) | Browse |"
            echo "|------|--------------|--------|"
            if [ -d "$OUT_DIR" ]; then
              find "$OUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort | while read -r name; do
                echo "| \`${name}\` | [raw](${BASE_RAW}/${OUT_DIR}/${name}) | [view](${BASE_BLOB}/${OUT_DIR}/${name}) |"
              done
            else
              echo "| _(no files — run may have failed)_ | | |"
            fi
            echo ""
            echo "### Zip packages"
            echo ""
            echo "| Archive | Raw (direct) | Browse |"
            echo "|---------|--------------|--------|"
            echo "| \`${DATE}.zip\` | [raw](${BASE_RAW}/output/${DATE}.zip) | [view](${BASE_BLOB}/output/${DATE}.zip) |"
            echo "| \`latest.zip\` | [raw](${BASE_RAW}/output/latest.zip) | [view](${BASE_BLOB}/output/latest.zip) |"
          } >> "$GITHUB_STEP_SUMMARY"
