name: Code Quality

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "config/**"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "run.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "jscpd.json"
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Lint, dead-code, duplication
        run: python -m scripts.quality
